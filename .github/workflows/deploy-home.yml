name: Deploy to home server

# Push 到 main 自動觸發 — 用家裡的 self-hosted runner
# (auslife-home-show, label: show) 直接 build 並寫入 nginx-static
# 沒有 SSH，因為 runner 已經在 server 上面跑。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-home
  cancel-in-progress: false

permissions:
  contents: write   # 補完的流程圖要 commit 回 repo

jobs:
  deploy:
    runs-on: [self-hosted, show]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # data/skills/*.json 才是資料來源，skills-data.ts 是產物。
      # 每次都重生，避免有人只改 JSON 忘了跑產生器。
      - name: Rebuild skills-data.ts from data/skills/
        run: npm run build:skills

      # 圖片由每日收錄流程在發布前生成並目視審核；CI不得繞過審核或額度。
      - name: Require prepared skill images
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of fs.readdirSync('data/skills').filter(f => f.endsWith('.json'))) {
            const skill = JSON.parse(fs.readFileSync('data/skills/' + file, 'utf8'));
            if (skill.illustration && !fs.existsSync('public/skills-img/' + skill.slug + '.webp')) {
              throw new Error('Missing reviewed image: ' + skill.slug);
            }
          }
          NODE

      - name: Build (static export)
        env:
          NODE_ENV: production
        run: npm run build

      - name: Verify SEO and internal links in export
        run: npm run check:seo

      - name: Publish verified release with rollback
        run: python3 tools/deploy-atomic.py --source out --revision "$GITHUB_SHA"

      - name: Smoke test (origin direct)
        run: |
          curl --fail --silent --show-error --resolve show.intelliverse.tw:443:127.0.0.1 \
            -o /dev/null -w "origin %{http_code}\n" \
            https://show.intelliverse.tw/
